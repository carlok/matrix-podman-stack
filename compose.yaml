# Private Matrix stack for rootless Podman Compose.
# All persistent state is on the host under DATA_DIR (bind mounts only).
# Reverse proxy (nginx) runs on the host — services bind to 127.0.0.1 only.
# Long-running services use restart: unless-stopped (survive daemon restart with podman-restart.service).
# One-shot jobs (profile bootstrap) use restart: "no".

name: matrix-podman-stack

x-synapse-image: &synapse_image docker.io/matrixdotorg/synapse:v1.163.2

# Optional per-service memory caps (Podman: mem_limit). Override in .env; see README sizing.
x-mem-postgres: &mem_postgres
  mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
x-mem-synapse: &mem_synapse
  mem_limit: ${SYNAPSE_MEM_LIMIT:-768m}
x-mem-element: &mem_element
  mem_limit: ${ELEMENT_MEM_LIMIT:-128m}
x-mem-nats: &mem_nats
  mem_limit: ${NATS_MEM_LIMIT:-256m}
x-mem-valkey: &mem_valkey
  mem_limit: ${VALKEY_MEM_LIMIT:-256m}
x-mem-garage: &mem_garage
  mem_limit: ${GARAGE_MEM_LIMIT:-512m}
x-mem-qdrant: &mem_qdrant
  mem_limit: ${QDRANT_MEM_LIMIT:-1g}
x-mem-ollama: &mem_ollama
  mem_limit: ${OLLAMA_MEM_LIMIT:-8g}
x-mem-prometheus: &mem_prometheus
  mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
x-mem-grafana: &mem_grafana
  mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
x-mem-bridge: &mem_bridge
  mem_limit: ${MAUTRIX_TELEGRAM_MEM_LIMIT:-512m}

# Container runtime hardening (Podman/Docker). Services that break with read_only or cap_drop
# are documented in docs/SECURITY-AUDIT.md.
x-pids-limit: &pids_limit
  pids_limit: ${CONTAINER_PIDS_LIMIT:-256}

x-security-opt: &security_opt
  security_opt:
    - no-new-privileges:true

x-cap-drop-all: &cap_drop_all
  cap_drop:
    - ALL

x-caps-postgres: &caps_postgres
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

x-caps-valkey: &caps_valkey
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETGID
    - SETUID

x-harden-postgres: &harden_postgres
  <<: [*pids_limit, *security_opt, *cap_drop_all, *caps_postgres]

x-harden-synapse: &harden_synapse
  <<: [*pids_limit, *security_opt, *cap_drop_all]

x-harden-element: &harden_element
  <<: [*pids_limit, *security_opt]
  # read_only not used: Element entrypoint writes nginx config under /etc/nginx/conf.d

x-harden-bus: &harden_bus
  <<: [*pids_limit, *security_opt, *cap_drop_all, *caps_valkey]

x-harden-monitoring: &harden_monitoring
  <<: [*pids_limit, *security_opt, *cap_drop_all]

# Rootless Podman: map host UID/GID into the container (writable bind mounts).
x-podman-userns: &podman_userns
  userns_mode: keep-id

services:
  postgres-synapse:
    <<: [*mem_postgres, *harden_postgres]
    image: docker.io/library/postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SYNAPSE_POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${SYNAPSE_POSTGRES_PASSWORD:?set SYNAPSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${SYNAPSE_POSTGRES_DB:-synapse}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ${DATA_DIR:-./data}/postgres-synapse:/var/lib/postgresql:Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SYNAPSE_POSTGRES_USER:-synapse} -d ${SYNAPSE_POSTGRES_DB:-synapse}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - matrix-db

  synapse:
    <<: [*mem_synapse, *harden_synapse, *podman_userns]
    image: *synapse_image
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres-synapse:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:?set SYNAPSE_SERVER_NAME in .env}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - ${DATA_DIR:-./data}/synapse:/data:Z
    ports:
      - "127.0.0.1:${SYNAPSE_HTTP_PORT:-8008}:8008"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8008/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - matrix
      - matrix-db

  element:
    <<: [*mem_element, *harden_element]
    image: docker.io/vectorim/element-web:v1.12.32
    restart: unless-stopped
    user: "0:0"
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/element/config.json:/app/config.json:ro,Z
    ports:
      - "127.0.0.1:${ELEMENT_HTTP_PORT:-8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - matrix

  postgres-telegram:
    <<: [*mem_postgres, *harden_postgres]
    image: docker.io/library/postgres:18.6-bookworm
    restart: unless-stopped
    profiles:
      - telegram
    environment:
      POSTGRES_USER: ${TELEGRAM_POSTGRES_USER:-mautrix_telegram}
      POSTGRES_PASSWORD: ${TELEGRAM_POSTGRES_PASSWORD:?set TELEGRAM_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${TELEGRAM_POSTGRES_DB:-mautrix_telegram}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ${DATA_DIR:-./data}/postgres-telegram:/var/lib/postgresql:Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TELEGRAM_POSTGRES_USER:-mautrix_telegram} -d ${TELEGRAM_POSTGRES_DB:-mautrix_telegram}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - matrix-db

  mautrix-telegram:
    <<: [*mem_bridge, *harden_synapse]
    image: dock.mau.dev/mautrix/telegram:v0.2610.0
    restart: unless-stopped
    profiles:
      - telegram
    depends_on:
      postgres-telegram:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/mautrix-telegram:/data:Z
    networks:
      - matrix
      - matrix-db

  synapse-bootstrap:
    <<: *podman_userns
    image: *synapse_image
    restart: "no"
    profiles:
      - bootstrap
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/bin/bash", "/bootstrap/synapse-bootstrap.sh"]
    environment:
      SYNAPSE_UID: ${HOST_UID:-1000}
      SYNAPSE_GID: ${HOST_GID:-1000}
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:?set SYNAPSE_SERVER_NAME in .env}
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_POSTGRES_USER: ${SYNAPSE_POSTGRES_USER:-synapse}
      SYNAPSE_POSTGRES_PASSWORD: ${SYNAPSE_POSTGRES_PASSWORD:?set SYNAPSE_POSTGRES_PASSWORD in .env}
      SYNAPSE_POSTGRES_DB: ${SYNAPSE_POSTGRES_DB:-synapse}
      POSTGRES_HOST: postgres-synapse
      REGISTRATION_SHARED_SECRET: ${REGISTRATION_SHARED_SECRET:?set REGISTRATION_SHARED_SECRET in .env}
      MATRIX_MACAROON_SECRET: ${MATRIX_MACAROON_SECRET:?set MATRIX_MACAROON_SECRET in .env}
      MATRIX_FORM_SECRET: ${MATRIX_FORM_SECRET:?set MATRIX_FORM_SECRET in .env}
    volumes:
      - ${DATA_DIR:-./data}/synapse:/data:Z
      - ./bootstrap:/bootstrap:ro,Z
    depends_on:
      postgres-synapse:
        condition: service_healthy
    networks:
      - matrix-db

  prometheus:
    <<: [*mem_prometheus, *harden_monitoring, *podman_userns]
    image: docker.io/prom/prometheus:v3.15.1
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles:
      - monitoring
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ${DATA_DIR:-./data}/prometheus:/prometheus:Z
    ports:
      - "127.0.0.1:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - matrix

  nats:
    <<: [*mem_nats, *harden_bus]
    image: docker.io/library/nats:2.15.1-alpine
    restart: unless-stopped
    profiles:
      - bus
    volumes:
      - ${DATA_DIR:-./data}/nats/nats.conf:/etc/nats/nats.conf:ro,Z
      - ${DATA_DIR:-./data}/nats/jetstream:/data/jetstream:Z
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-14222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-18222}:8222"
    command: ["-c", "/etc/nats/nats.conf"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - matrix

  valkey:
    <<: [*mem_valkey, *harden_bus]
    image: docker.io/valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    profiles:
      - bus
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:-./data}/valkey:/data:Z
      - ${DATA_DIR:-./data}/valkey/valkey.conf:/etc/valkey/valkey.conf:ro,Z
    ports:
      - "127.0.0.1:${VALKEY_PORT:-16379}:6379"
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli --no-auth-warning -a \"${VALKEY_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - matrix

  garage:
    <<: [*mem_garage, *harden_bus]
    image: docker.io/dxflrs/garage:v2.5.0
    restart: unless-stopped
    profiles:
      - object
    volumes:
      - ${DATA_DIR:-./data}/garage/garage.toml:/etc/garage.toml:ro,Z
      - ${DATA_DIR:-./data}/garage/meta:/var/lib/garage/meta:Z
      - ${DATA_DIR:-./data}/garage/data:/var/lib/garage/data:Z
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-13900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-13903}:3903"
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:3903/health | grep -q operational || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - matrix

  qdrant:
    <<: [*mem_qdrant, *harden_bus]
    image: docker.io/qdrant/qdrant:v1.20.0
    restart: unless-stopped
    profiles:
      - vectors
    volumes:
      - ${DATA_DIR:-./data}/qdrant/config.yaml:/qdrant/config/production.yaml:ro,Z
      - ${DATA_DIR:-./data}/qdrant/storage:/qdrant/storage:Z
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-16333}:6333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- --header=\"api-key: ${QDRANT_API_KEY}\" http://127.0.0.1:6333/collections >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - matrix

  ollama:
    <<: [*mem_ollama, *pids_limit, *security_opt]
    image: docker.io/ollama/ollama:0.40.11
    restart: unless-stopped
    profiles:
      - llm
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama:Z
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:11434/api/tags >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - matrix

  grafana:
    <<: [*mem_grafana, *harden_monitoring]
    image: docker.io/grafana/grafana:13.2.4
    restart: unless-stopped
    user: "0:0"
    profiles:
      - monitoring
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    volumes:
      - ${DATA_DIR:-./data}/grafana:/var/lib/grafana:Z
    ports:
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000"
    networks:
      - matrix

networks:
  matrix:
    driver: bridge
  matrix-db:
    driver: bridge
    internal: true
