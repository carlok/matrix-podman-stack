# Dependabot version updates: https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Image tags in compose.yaml (docker-compose ecosystem).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Postgres major upgrades need a planned migration (see docs/postgres-upgrade.md).
      - dependency-name: library/postgres
        update-types:
          - version-update:semver-major
