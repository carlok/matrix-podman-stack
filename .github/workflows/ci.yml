name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman podman-compose shellcheck python3-pip
          python3 -m pip install --user ruff PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate compose
        run: |
          cp .env.example .env
          podman compose config > /dev/null

      - name: Shellcheck
        run: shellcheck -e SC1090,SC1091 scripts/*.sh bootstrap/*.sh

      - name: Ruff (example bot)
        run: ruff check bots/

      - name: Python syntax (scripts)
        run: python3 -m py_compile scripts/*.py bots/example_bot/bot.py

      - name: Ruff (scripts)
        run: ruff check scripts/ bots/

      - name: Bot config loader
        run: |
          python3 scripts/load_bot_config.py --config bots.example.yaml --json | python3 -m json.tool

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install test dependencies
        run: |
          python3 -m pip install --user -r requirements-dev.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pytest with coverage
        run: |
          pytest -m "not integration" --cov --cov-report=term-missing --cov-branch --cov-report=xml:coverage.xml
          pytest --co -q | tail -n 1

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Bats (install-systemd-service)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bats tests/bats/

  config-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy config scan (compose)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: config
          scan-ref: compose.yaml
          severity: HIGH,CRITICAL
          exit-code: 0
