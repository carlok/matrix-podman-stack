name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman podman-compose shellcheck python3-pip
          python3 -m pip install --user ruff PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate compose
        run: |
          cp .env.example .env
          podman compose config > /dev/null

      - name: Shellcheck
        run: shellcheck -e SC1090,SC1091 scripts/*.sh bootstrap/*.sh

      - name: Ruff (example bot)
        run: ruff check bots/

      - name: Python syntax (scripts)
        run: python3 -m py_compile scripts/*.py bots/example_bot/bot.py

      - name: Ruff (scripts)
        run: ruff check scripts/ bots/

      - name: Bot config loader
        run: |
          python3 scripts/load_bot_config.py --config bots.example.yaml --json | python3 -m json.tool

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          python3 -m pip install --user -r requirements-dev.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pytest with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-branch --cov-report=xml:coverage.xml
          pytest --co -q | tail -n 1

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Bats (install-systemd-service)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bats tests/bats/
